                - text: https://example.test/privacy
              - generic [ref=f3e251]:
                - strong [ref=f3e252]: Set up the coupon text in Omnisend
                - list [ref=f3e253]:
                  - listitem [ref=f3e254]: Create a Welcome automation with Subscribed to Marketing as its trigger.
                  - listitem [ref=f3e255]: Filter to SMS, First subscription = true, and Origin = API. Remove the default “Signup form” method filter.
                  - listitem [ref=f3e256]: Add an SMS with your unique WooCommerce discount code. Enable WooCommerce discount generation first.
                  - listitem [ref=f3e257]: Remove intentional delays, then enable the workflow before enabling this popup. Quiet hours and carrier delivery still apply.
                - paragraph [ref=f3e258]: Use offer copy that matches the coupon you configure. This plugin saves and subscribes the contact; Omnisend creates the code and sends the text.
                - link "Omnisend coupon setup ↗" [ref=f3e259] [cursor=pointer]:
                  - /url: https://support.omnisend.com/en/articles/9470439-add-unique-discounts-to-automated-sms-mms
            - generic [ref=f3e260]:
              - button "Save settings" [ref=f3e261] [cursor=pointer]
              - button "Preview popup" [ref=f3e262] [cursor=pointer]
