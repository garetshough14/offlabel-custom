              - generic [ref=f3e242]:
                - checkbox "Remove the saved API key" [ref=f3e243] [cursor=pointer]
                - text: Remove the saved API key
              - generic [ref=f3e244]: SMS consent wording
              - textbox "SMS consent wording" [ref=f3e245]: I agree to receive recurring automated marketing texts from Off Label Research at the number provided. Consent is not a condition of purchase. Message frequency varies. Message and data rates may apply. Reply STOP to unsubscribe or HELP for help.
              - paragraph [ref=f3e246]: Use your approved SMS disclosure. Keep your brand name, recurring marketing consent, message rates and frequency, STOP / HELP instructions, and no-purchase-condition wording.
              - generic [ref=f3e247]: SMS terms URL
              - textbox "SMS terms URL" [ref=f3e248]:
                - /placeholder: https://…
