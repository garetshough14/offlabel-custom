              - heading "Saved where it belongs." [level=2] [ref=f3e266]
              - paragraph [ref=f3e267]: Every submission updates the member’s existing WooCommerce billing phone.
              - code [ref=f3e268]: billing_phone
              - paragraph [ref=f3e269]: Matches the billing_phone column in your export. No new phone field is created. Shipping phone numbers are not changed.
