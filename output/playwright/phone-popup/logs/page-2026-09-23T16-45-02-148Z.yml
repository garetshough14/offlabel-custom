                - checkbox "Collect SMS consent and send opt-ins to Omnisend" [ref=f3e238] [cursor=pointer]
                - text: Collect SMS consent and send opt-ins to Omnisend
              - paragraph [ref=f3e239]: When off, this plugin only saves the account phone number. When on, members must check the SMS consent box to submit this offer.
              - generic [ref=f3e240]: Omnisend API key
              - textbox "Omnisend API key" [ref=f3e241]:
