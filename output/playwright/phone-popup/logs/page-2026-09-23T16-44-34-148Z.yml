                - generic [ref=f2e238]:
                  - checkbox "Remove the saved API key" [ref=f2e239] [cursor=pointer]
                  - text: Remove the saved API key
                - generic [ref=f2e240]: SMS consent wording
                - textbox "SMS consent wording" [ref=f2e241]: I agree to receive recurring automated marketing texts from Off Label Research at the number provided. Consent is not a condition of purchase. Message frequency varies. Message and data rates may apply. Reply STOP to unsubscribe or HELP for help.
                - paragraph [ref=f2e242]: Use your approved SMS disclosure. Keep your brand name, recurring marketing consent, message rates and frequency, STOP / HELP instructions, and no-purchase-condition wording.
