                - paragraph [ref=f2e263]: Every submission updates the member’s existing WooCommerce billing phone.
                - code [ref=f2e264]: billing_phone
                - paragraph [ref=f2e265]: Matches the billing_phone column in your export. No new phone field is created. Shipping phone numbers are not changed.
