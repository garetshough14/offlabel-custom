                  - checkbox "Collect SMS consent and send opt-ins to Omnisend" [checked] [ref=f2e234] [cursor=pointer]
                  - text: Collect SMS consent and send opt-ins to Omnisend
                - paragraph [ref=f2e235]: When off, this plugin only saves the account phone number. When on, members must check the SMS consent box to submit this offer.
                - generic [ref=f2e236]: Omnisend API key
                - textbox "Omnisend API key" [ref=f2e237]:
