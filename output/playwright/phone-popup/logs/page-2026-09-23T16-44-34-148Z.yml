                  - text: https://example.test/privacy
                - generic [ref=f2e247]:
                  - strong [ref=f2e248]: Set up the coupon text in Omnisend
                  - list [ref=f2e249]:
                    - listitem [ref=f2e250]: Create a Welcome automation with Subscribed to Marketing as its trigger.
                    - listitem [ref=f2e251]: Filter to SMS, First subscription = true, and Origin = API. Remove the default “Signup form” method filter.
                    - listitem [ref=f2e252]: Add an SMS with your unique WooCommerce discount code. Enable WooCommerce discount generation first.
                    - listitem [ref=f2e253]: Remove intentional delays, then enable the workflow before enabling this popup. Quiet hours and carrier delivery still apply.
                  - paragraph [ref=f2e254]: Use offer copy that matches the coupon you configure. This plugin saves and subscribes the contact; Omnisend creates the code and sends the text.
                  - link "Omnisend coupon setup ↗" [ref=f2e255] [cursor=pointer]:
                    - /url: https://support.omnisend.com/en/articles/9470439-add-unique-discounts-to-automated-sms-mms
