<style id="olr-catalog-page-font-failsafe">
body :is(#olr-catalog-type-system, .olr-gitpress-site.olr-redesign[data-olr-page="research"]),
body :is(#olr-catalog-type-system, .olr-gitpress-site.olr-redesign[data-olr-page="research"]) :where(*) { font-family: var(--olr-font, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif) !important; }
body :is(#olr-catalog-type-system, .olr-gitpress-site.olr-redesign[data-olr-page="research"]) :where(*) { letter-spacing: 0 !important; }
body :is(#olr-catalog-type-system, .olr-gitpress-site.olr-redesign[data-olr-page="research"]) :where(h1, h2, h3, h4, h5, h6) { font-weight: 700 !important; letter-spacing: -.015em !important; }
body :is(#olr-catalog-type-system, .olr-gitpress-site.olr-redesign[data-olr-page="research"]) :where(button, .button, summary, nav a, label) { font-weight: 600 !important; }
body :is(#olr-catalog-type-system, .olr-gitpress-site.olr-redesign[data-olr-page="research"]) :where(.olr-label, small) { letter-spacing: .025em !important; }
</style>
<div id="olr-catalog-type-system" class="olr-gitpress-site olr-redesign" data-olr-page="research">
  <main class="olr-page olr-page--research">
    <section class="olr-research-hero" aria-labelledby="olr-research-title">
      <div class="olr-research-shell olr-research-hero__inner">
        <div class="olr-research-hero__copy">
          <p class="olr-label">Off Label Research</p>
          <h1 id="olr-research-title">Research</h1>
          <h2>Explore the collection.</h2>
          <p>Independent research. Third-party tested.<br>Built around transparency.</p>
        </div>
      </div>
    </section>

    [olr_research_catalog]

    <section class="olr-research-documentation" aria-labelledby="olr-research-documentation-title">
      <div class="olr-research-documentation__copy">
        <p>Quality isn’t a claim.</p>
        <h2 id="olr-research-documentation-title">It’s<br>documented.</h2>
        <span>Every batch is third-party tested.<br>Because the standard is proof.</span>
        <a href="/testing/">View testing &amp; documentation <b aria-hidden="true">→</b></a>
      </div>
      <figure class="olr-research-documentation__media" aria-hidden="true"></figure>
    </section>
  </main>
</div>
