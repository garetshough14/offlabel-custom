<div class="olr-gitpress-site olr-redesign" data-olr-page="journal">
  <div class="olr-page olr-page--journal">
    <section class="olr-page-hero" aria-labelledby="olr-journal-page-title">
      <div class="olr-shell olr-page-hero__inner">
        <p class="olr-page-hero__kicker">The journal</p>
        <h1 id="olr-journal-page-title">NOTES FROM BEYOND THE DEFAULT.</h1>
        <p>Research context, catalog notes, documentation updates, and the questions shaping our work.</p>
      </div>
    </section>

    <section class="olr-section olr-journal-archive" aria-labelledby="olr-journal-archive-title">
      <div class="olr-shell">
        <div class="olr-section__heading">
          <h2 id="olr-journal-archive-title">LATEST ENTRIES</h2>
        </div>
        <div class="olr-shortcode-slot">
          [olr_journal limit="9"]
        </div>
      </div>
    </section>

    <section class="olr-type-break" aria-label="Off Label Research journal statement">
      <div class="olr-shell">
        <p>THE QUESTION CHANGES.<br>THE RECORD REMAINS.</p>
      </div>
    </section>
  </div>
</div>
