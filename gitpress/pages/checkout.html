<div class="olr-gitpress-site olr-redesign woocommerce-page" data-olr-page="checkout">
  <div class="olr-page olr-page--commerce olr-page--checkout">
    <section class="olr-page-hero olr-page-hero--compact" aria-labelledby="olr-checkout-title">
      <div class="olr-shell olr-page-hero__inner">
        <p class="olr-page-hero__kicker">Complete your order</p>
        <h1 id="olr-checkout-title">CHECKOUT.</h1>
        <p>Confirm your details, review available payment methods, and place your order.</p>
      </div>
    </section>
    <section class="olr-section olr-commerce" aria-labelledby="olr-checkout-content-title">
      <div class="olr-shell">
        <h2 class="olr-visually-hidden" id="olr-checkout-content-title">Checkout details</h2>
        [woocommerce_checkout]
      </div>
    </section>
  </div>
</div>
