<div class="olr-gitpress-site olr-redesign woocommerce-page" data-olr-page="product-detail">
  <div class="olr-page olr-page--product-detail">
    <header class="olr-product-record-head">
      <div class="olr-shell olr-product-record-head__inner">
        <a href="/shop/">Research</a>
        <span>Product</span>
      </div>
    </header>

    <section class="olr-product-record" aria-label="Research product details">
      <div class="olr-shell olr-product-record__inner">
        [olr_product_page]
      </div>
    </section>

    <section class="olr-newsletter olr-product-box" aria-labelledby="olr-product-box-title">
      <div class="olr-shell olr-product-box__inner">
        <div class="olr-product-box__title">
          <p>Research more. Save more.</p>
          <h2 id="olr-product-box-title">Build your research box.</h2>
          <span>Mix and match any eligible products.</span>
        </div>
        <div class="olr-product-box__offers" aria-label="Research box offers">
          <div><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m20 3 14 8v18l-14 8-14-8V11zM6 11l14 8 14-8M20 19v18M13 15v6l4 2v-6M27 15v6l-4 2v-6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg><p><span>Any 5 bottles</span><strong>25% off</strong></p></div>
          <div><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m20 3 14 8v18l-14 8-14-8V11zM6 11l14 8 14-8M20 19v18M13 15v6l4 2v-6M27 15v6l-4 2v-6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg><p><span>Any 10 bottles</span><strong>30% off</strong></p></div>
        </div>
        <a class="olr-product-box__cta" href="/shop/">Shop now <span aria-hidden="true">→</span></a>
        <img class="olr-product-box__art" src="https://cdn.jsdelivr.net/gh/garetshough14/offlabel-custom@main/images/editorial/hero-three-vials-transparent-glass.png" alt="" width="1200" height="900" loading="lazy" aria-hidden="true">
      </div>
    </section>
  </div>
</div>
