<div class="olr-gitpress-site olr-redesign woocommerce-page" data-olr-page="cart">
  <div class="olr-page olr-page--commerce olr-page--cart">
    <section class="olr-page-hero olr-page-hero--compact" aria-labelledby="olr-cart-title">
      <div class="olr-shell olr-page-hero__inner">
        <p class="olr-page-hero__kicker">Your order</p>
        <h1 id="olr-cart-title">CART.</h1>
        <p>Review products, strengths, quantities, and totals before checkout.</p>
      </div>
    </section>
    <section class="olr-section olr-commerce" aria-labelledby="olr-cart-content-title">
      <div class="olr-shell">
        <h2 class="olr-visually-hidden" id="olr-cart-content-title">Cart contents</h2>
        [woocommerce_cart]
      </div>
    </section>
  </div>
</div>
