<!-- Admin notification: paste into the email body's Text/HTML editor. -->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#f7f5f1" style="width:100%;background:#f7f5f1;border-collapse:collapse;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:640px;border-collapse:collapse;color:#080808;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif;">
        <tr>
          <td style="padding:0 0 24px;border-bottom:1px solid #92908c;font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-1.5px;">OFF LABEL</td>
        </tr>
        <tr>
          <td style="padding:28px 0 10px;font-size:11px;line-height:1.5;letter-spacing:2px;">CONTACT FORM &nbsp;/&nbsp; ADMIN NOTIFICATION</td>
        </tr>
        <tr>
          <td style="padding:0 0 14px;font-size:32px;line-height:1.15;font-weight:800;letter-spacing:-1px;">NEW MESSAGE.</td>
        </tr>
        <tr>
          <td style="padding:0 0 24px;font-size:15px;line-height:1.7;">A visitor has contacted Off Label Research. Their submitted details are below.</td>
        </tr>
        <tr>
          <td bgcolor="#ffffff" style="padding:20px;border:1px solid #92908c;background:#ffffff;font-size:15px;line-height:1.7;overflow-wrap:anywhere;word-break:break-word;">
            {all_data}
          </td>
        </tr>
        <tr>
          <td style="padding:24px 0 8px;font-size:11px;line-height:1.5;font-weight:700;letter-spacing:1px;">SUBMITTED FROM</td>
        </tr>
        <tr>
          <td style="padding:0 0 28px;font-size:13px;line-height:1.7;overflow-wrap:anywhere;word-break:break-word;">
            <a href="{embed_post.permalink}" style="color:#080808;text-decoration:underline;">{embed_post.permalink}</a>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 0 0;border-top:1px solid #92908c;color:#55534f;font-size:12px;line-height:1.7;">Internal notification for the Off Label Research team.<br>Please handle customer information confidentially.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
