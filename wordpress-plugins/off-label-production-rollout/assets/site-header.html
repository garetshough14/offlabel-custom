<div class="olr-gitpress-site olr-redesign olr-managed-header">
  <aside class="olr-announcement" aria-label="Important product notice">
    <div class="olr-shell olr-announcement__inner">
      <span>Research use only</span>
      <span class="olr-announcement__separator" aria-hidden="true">/</span>
      <span>Not for human consumption</span>
      <span class="olr-announcement__separator" aria-hidden="true">/</span>
      <a href="https://offlabelresearch.com/coas/">Document archive</a>
    </div>
  </aside>

  <div class="site-header" id="siteHeader">
    <div class="olr-shell site-header__inner">
      <a class="custom-logo-link olr-brand" href="https://offlabelresearch.com/" aria-label="Off Label Research home">
        <img
          class="custom-logo olr-brand__logo"
          src="https://cdn.jsdelivr.net/gh/garetshough14/offlabel-custom@main/branding/off-label-logo-cropped-black.webp"
          alt="Off Label Research"
          width="1199"
          height="169"
          decoding="async"
        >
      </a>

      <nav class="olr-primary-nav olr-primary-nav--desktop" aria-label="Primary navigation">
        <a href="https://offlabelresearch.com/" data-nav="home">Home</a>
        <a href="https://offlabelresearch.com/about/" data-nav="about">About</a>
        <a href="https://offlabelresearch.com/catalog/" data-nav="catalog">Catalog</a>
        <a href="https://offlabelresearch.com/coas/" data-nav="coas">COAs</a>
        <a href="https://offlabelresearch.com/contact-us/" data-nav="contact">Contact</a>
      </nav>

      <nav class="olr-header-actions" aria-label="Cart">
        <a href="https://offlabelresearch.com/cart/" class="olr-bag-link">
          <span class="screen-reader-text">Cart</span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path d="M5 8.5h14l-1 12H6l-1-12Z" fill="none" stroke="currentColor" stroke-width="1.5"></path>
            <path d="M9 9V6a3 3 0 0 1 6 0v3" fill="none" stroke="currentColor" stroke-width="1.5"></path>
          </svg>
          <span class="olr-cart-count" aria-label="Cart item count">[olr_cart_count]</span>
        </a>
      </nav>

      <details class="olr-nav-shell" data-olr-nav-drawer>
        <summary class="olr-nav-toggle" data-olr-nav-toggle aria-controls="olr-mobile-navigation" aria-expanded="false">
          <span class="screen-reader-text" data-olr-nav-label>Open menu</span>
          <span class="olr-nav-toggle__icon" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
        </summary>
        <nav class="olr-primary-nav olr-primary-nav--mobile" id="olr-mobile-navigation" data-olr-nav-panel aria-label="Mobile primary navigation" tabindex="-1">
          <a href="https://offlabelresearch.com/" data-nav="home">Home</a>
          <a href="https://offlabelresearch.com/about/" data-nav="about">About</a>
          <a href="https://offlabelresearch.com/catalog/" data-nav="catalog">Catalog</a>
          <a href="https://offlabelresearch.com/coas/" data-nav="coas">COAs</a>
          <a href="https://offlabelresearch.com/contact-us/" data-nav="contact">Contact</a>
          <a href="https://offlabelresearch.com/cart/" class="olr-bag-link"><span class="screen-reader-text">Cart</span><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M5 8.5h14l-1 12H6l-1-12Z" fill="none" stroke="currentColor" stroke-width="1.5"></path><path d="M9 9V6a3 3 0 0 1 6 0v3" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg><span class="olr-cart-count" aria-label="Cart item count">[olr_cart_count]</span></a>
        </nav>
      </details>
    </div>
  </div>
</div>
